plugins {
    id 'com.android.application'
}

// Release signing is optional: point -PkeystoreProperties (or the TVAMBIENT_KEYSTORE env var) at a
// keystore.properties file with storeFile, storePassword, keyAlias and keyPassword. Without it the release APK is
// signed with the local debug key, which is fine for building and testing your own copy.
def keystorePropsPath = project.findProperty('keystoreProperties') ?: System.getenv('TVAMBIENT_KEYSTORE')
def keystoreProps = null
if (keystorePropsPath && file(keystorePropsPath).exists()) {
    keystoreProps = new Properties()
    file(keystorePropsPath).withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'dev.tvambient'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.tvambient'
        minSdk 29
        targetSdk 34
        versionCode 4
        versionName '1.3.0'
    }

    signingConfigs {
        if (keystoreProps != null) {
            release {
                storeFile file(new File(file(keystorePropsPath).parentFile, keystoreProps['storeFile']))
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystoreProps != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    lint {
        // ShellCapture reaches hidden APIs on purpose: it runs as the shell user, where they are allowed.
        disable 'DiscouragedPrivateApi', 'SoonBlockedPrivateApi', 'BlockedPrivateApi', 'PrivateApi'
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // USB serial drivers (CH340/CH341, CP210x, FTDI, CDC-ACM).
    implementation 'com.github.mik3y:usb-serial-for-android:3.8.1'
    // ADB client: connects to the TV's own adbd on 127.0.0.1:5555 to start ShellCapture as the shell user.
    implementation('dev.mobile:dadb:1.2.7') {
        // dadb 1.2.7 publishes its test framework as a runtime dependency.
        exclude group: 'org.junit.jupiter'
        exclude group: 'org.junit.platform'
        exclude group: 'junit'
        exclude group: 'org.opentest4j'
        exclude group: 'org.apiguardian'
    }
}
